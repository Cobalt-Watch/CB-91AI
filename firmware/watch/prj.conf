# The watch: the product application.
#
# What is not here, on purpose, and which the bench self-test carries instead:
# the shell, USB, the diagnostic commands. Two build variants on top of this
# one (EF-70): debug.conf and release.conf.

# --- Shared library (firmware/lib) ---
CONFIG_CB91AI_LIB_LCD=y
CONFIG_CB91AI_LIB_CLOCK=y
# The gestures of the case buttons (lot D3), a pure state machine
CONFIG_CB91AI_LIB_GESTURE=y
# Date and time by hand in the settings (ui.c), checked on the PC
CONFIG_CB91AI_LIB_CALENDAR=y
# The voice (lot E1): the microphone, the end of a take on silence, the note
# container. The accelerometer: put to sleep at boot (0.2.1+9 to +11 woke it
# for its thermometer); its motion comes with D4.
CONFIG_CB91AI_LIB_MIC=y
# 6 dB under the PDM's default since 0.2.1+31: a voice clipped when spoken
# close to the watch (a note of 2026-09-29, at -10 dBFS of speech), and the
# phone's recognizer lost its words; the detector's floor
# follows the gain (vad_set_gain_db)
CONFIG_CB91AI_MIC_GAIN_DB=-6
CONFIG_CB91AI_LIB_VAD=y
CONFIG_CB91AI_LIB_NOTE=y
CONFIG_CB91AI_LIB_ACCEL=y
CONFIG_I2C=y
# The thermometer of the "tE P" screen: the nRF52840's own (TEMP, through
# Zephyr's driver), the choice after the test of 2026-09-25
CONFIG_SENSOR=y

# --- Peripherals of the display and of the wall clock ---
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_REGULATOR=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_CLOCK_CONTROL=y

# The wall clock keeps its correction in the settings and its time in retained
# RAM, at a fixed address of the board devicetree (lib/clock.c)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
# +137.9 ppm measured on the V1 boards (tools/lfxo_drift.py); each watch then
# refines its own value on the time its phone gives it
CONFIG_CB91AI_CLOCK_DEFAULT_PPB=138000

# 12-hour by default on the V1: its hour tens can only draw "1" (V2-31)
CONFIG_CB91AI_CLOCK_24H=n
CONFIG_CB91AI_LCD_GLASS_COM2_ON_COM0=y

# --- Watchdog ---
# Started first thing in main(), fed last thing before a software reset. The
# hardware window is MIN_TIMEOUT + HW_FALLBACK_DELAY and only changes at a
# hardware reset: never feed less often than the shortest window ever shipped
# (4 s since 0.1.21).
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=3000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000

# --- Idle consumption ---
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_MAIN_STACK_SIZE=4096
# The log mode is the development build's (debug.conf); the product has no log
CONFIG_LOG=y

# --- The cell (src/power.c): the VDD input of the SAADC ---
CONFIG_ADC=y

# --- The RGB LED (src/led.c): the light of LIGHT, the blink of a take, the
# verdict of the app, on the three PWM channels of pwm0 ---
CONFIG_PWM=y

# --- The voice notes (lot E1, src/recorder.c, src/notes.c) ---
# The PDM microphone through the dmic API, as in the self-test; LC3 at
# 16 kbit/s (K3), which computes in floating point: the FPU, shared since the
# audio thread is not the only one the compiler may give FP registers to, and
# a full C library (picolibc). The notes fill the 1 MB QSPI flash, which the
# driver puts in deep power-down between accesses.
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_LIBLC3=y
CONFIG_NORDIC_QSPI_NOR=y

# --- Bluetooth LE (lot D6, src/radio.c, src/link.c) ---
# The settings of the self-test (app/prj.conf), which the bench validated: one
# connection, 0 dBm (EF-31), the 250 ppm sleep clock of the V1 (EF-39), large
# packets and 2M PHY for the updates and the notes.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="CB-91AI"
# The name of each watch, given by the phone (Cobalt Link key 0x06): 11
# characters at most, what fits in the scan response next to the UUID of SMP;
# the host keeps it in the settings ("bt/name"), "CB-91AI" until then
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=11
CONFIG_BT_DEVICE_APPEARANCE=192
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="CB-91AI"
CONFIG_BT_DIS_MANUF_NAME_STR="COBALT"
# The revision string comes from the VERSION file, see CMakeLists.txt (EF-64)
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="V1"
CONFIG_BT_CTLR_TX_PWR_0=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y
# The watch asks for a larger MTU at once: a note goes in notifications of
# MTU - 4 bytes (the Cobalt Link specification)
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
# Connection parameters within Apple's rules (interval of 15 ms at least):
# 15 to 30 ms, and a supervision timeout of
# 4 s from the start of the link (lot B5: 420 ms lost the link during a slot
# erase), asked 5 s after the connection. A latency of 30 (Cobalt Link,
# since 0.2.1+21): the watch skips the events
# where it has nothing to send, listening about once a second while it waits
# for the phone, and sends at every event as soon as it has data (the
# controller cancels the latency); Apple's rules hold (30 ms x 31 <= 2 s, and
# 4 s > 3 x 930 ms). MCUmgr asks for its own, latency 0, while an update runs,
# and gives these back 5 s after its last command.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- Updates over SMP (lot D6, src/update.c) ---
# As in the self-test: MCUmgr over Bluetooth, direct execution with revert
# (sysbuild.conf), images linked for their slot and refused in the other one,
# versions compared down to the build number, partial erase of the internal
# flash so that the radio keeps its link during the erase of a slot (lot B5).
# The parameters asked during a transfer keep within Apple's rules too: iOS
# refused the 7.5 ms of the defaults on 2026-09-21 (lot B4).
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MIN_INT=12
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_MAX_INT=24
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_TIMEOUT=400
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
CONFIG_MCUMGR_GRP_IMG_REJECT_DIRECT_XIP_MISMATCHED_SLOT=y
CONFIG_MCUMGR_GRP_IMG_VERSION_CMP_USE_BUILD_NUMBER=y
CONFIG_STREAM_FLASH=y
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
# Hooks: host activity (idle disconnect, session), no upload while this image
# is in test (its way back is the other slot), the reset (update.c)
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
# The system work queue runs the Bluetooth TX path, and here the Cobalt Link
# notifications too (link.c): 3 KB, 2304 B in the self-test. Measured over SMP
# with ble_update.py --tasks (debug.conf).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# --- The Cobalt Link messages and the session (lot D6) ---
CONFIG_CB91AI_LIB_LINK_PROTO=y

# --- Pairing (lot S1, src/pair.c, src/pairing.c) ---
# LE Secure Connections only, authenticated: the watch shows a passkey of five
# digits that the phone types (the application gives it, under 100 000, from
# the hardware generator); a single bond, kept in the settings; a pairing
# accepted only on a watch that holds none (2026-09-24).
# An exception to the rule on flash writes in Bluetooth callbacks:
# the host writes the bond itself, in its RX thread, once per pairing (the
# subscriptions later go through the system work queue). Hence 2 KB for that
# thread instead of 1.2, to be measured after a pairing (ble_update.py --tasks).
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_BONDING_REQUIRED=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_RX_STACK_SIZE=2048
