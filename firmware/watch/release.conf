# The watch, product variant (EF-70): nothing that only serves the bench.
#
#   west build ... -s <repo>/firmware/watch -- -DEXTRA_CONF_FILE=release.conf
#
# No shell, no console, no log: on a sealed watch the only window is the status
# the link reports (EF-73), and every kilobyte and every wake-up counts.

CONFIG_LOG=n
CONFIG_SHELL=n
CONFIG_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_BOOT_BANNER=n
# Keep the assertions off: a watch that stops is worse than one that carries on
CONFIG_ASSERT=n

# Updates from the paired phone only (lots S1 and S2): SMP needs an encrypted,
# authenticated link, as Cobalt Link does (the Cobalt Link specification)
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
