# The watch, bench variant (EF-70): what helps on the bench and never ships.
#
#   west build ... -s <repo>/firmware/watch -- -DEXTRA_CONF_FILE=debug.conf
#
# Log and shell over RTT (the board has no UART pads), advertising kept slow but
# permanent so that the watch stays reachable from the PC without a gesture,
# Cobalt Link open until the pairing of phase S, and the debug service of the
# bench tools (status line, time).

CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_PROMPT_RTT="watch:~$ "
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# Stale unread data of the previous run would otherwise swallow the boot log
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y
# The RTT shell polls its input from a timer; the default of 10 ms wakes the
# core a hundred times a second for a console that is rarely attached
CONFIG_SHELL_RTT_RX_POLL_PERIOD=250
CONFIG_KERNEL_SHELL=y

CONFIG_CB91AI_WATCH_ADV_ALWAYS=y
CONFIG_CB91AI_WATCH_LINK_OPEN=y
CONFIG_CB91AI_WATCH_DEBUG_SERVICE=y
# SMP open, as Cobalt Link is: the pairing (S1) would otherwise make MCUmgr ask
# for an authenticated link by default, and ble_update.py could no longer
# confirm or reset the watch. Checked in the .config before every upload.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
# Takes started by the harness, for the notes on a sealed watch (lot E1)
CONFIG_CB91AI_WATCH_DEBUG_TAKE=y
# The journal's period set by the harness, for its tests in minutes (lot T1)
CONFIG_CB91AI_WATCH_DEBUG_JOURNAL=y
# The wrist's thresholds tuned by the harness at the wrist (lot D4)
CONFIG_CB91AI_WATCH_DEBUG_WRIST=y
# The daily call's period set by the harness, for its test in minutes
CONFIG_CB91AI_WATCH_DEBUG_DAILY=y
# The trial of the calls: the radio as the product's for a while, each call
# timed to the phone's connection (lot N1a, risk R11)
CONFIG_CB91AI_WATCH_DEBUG_TRIAL=y
# A fixed pairing code, so that the bench pairs alone (tools/ble_pair.py, S2);
# the product draws it at random at every pairing
CONFIG_CB91AI_WATCH_DEBUG_PASSKEY=91091

# The stack used by each thread, over SMP (tools/ble_update.py --tasks): a
# sealed watch gives no other way to measure it. Each reading walks the threads
# with interrupts locked, their stacks byte by byte (about 1 ms): now and then,
# never in a loop.
CONFIG_MCUMGR_GRP_OS_TASKSTAT=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT_STACK_INFO=y
