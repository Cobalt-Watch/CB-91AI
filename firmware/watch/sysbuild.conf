# Build MCUboot together with the application and sign the application image.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
# Direct execution with revert (2026-09-20): the new image runs from the slot it
# was uploaded to, MCUboot copies nothing. An update used to end with 28 s of
# swap, the largest item of its 50 s and some 50 uAh of a coin cell. Same safety
# net as a swap: an image marked for test runs once, and is erased at the next
# reset unless it confirmed itself (EF-62). What it costs: one variant of the
# image per slot, built by sysbuild (app and app_slot1_variant), a version that
# must grow with each update (MCUboot starts the higher one), no way back to an
# older version.
SB_CONFIG_MCUBOOT_MODE_DIRECT_XIP_WITH_REVERT=y
# RSA-2048. The key file comes from the environment (CB91AI_SIGNING_KEY, see
# Kconfig.sysbuild), never from this repository; without it, the development
# key shipped with MCUboot (root-rsa-2048.pem), with which anyone can sign.
SB_CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
