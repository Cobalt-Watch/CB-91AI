# MCUboot on the CB-91AI: no console and no RTT block left in RAM, which would
# confuse the RTT capture of the application. Logging stays in the minimal
# mode chosen by MCUboot itself, its output simply goes nowhere. The board
# code still provisions the UICR at the first boot.
CONFIG_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_SERIAL=n

# Direct execution: MCUboot starts the slot that holds the higher version. Count
# the build number too (VERSION_TWEAK), so that development builds and the
# endurance series of ble_update.py can follow one another within a patch level.
CONFIG_BOOT_VERSION_CMP_USE_BUILD_NUMBER=y
