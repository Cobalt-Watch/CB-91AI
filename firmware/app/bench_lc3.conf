# Codec bench, LC3 (with bench_codec.conf). liblc3 is a module of the Zephyr
# manifest: `west update --narrow -o=--depth=1 liblc3`. It computes in floating
# point: it wants the FPU and a full libc, and Zephyr builds it with -O3.

CONFIG_FPU=y
CONFIG_LIBLC3=y

# The encoder uses 3.2 kB of stack (measured): with a smaller bench stack there
# is room for 3.2 s of speech, a short sentence for the round trips
# (`cb91ai codec roundtrip`), and the decoder.
CONFIG_CB91AI_CODEC_BENCH_MS=3200
CONFIG_CB91AI_CODEC_BENCH_STACK_SIZE=8192
