# COBALT CB-91AI bring-up firmware: board self-test over RTT

# Logging and shell over Segger RTT (the board has no UART pads)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="cb91ai:~$ "
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_PROMPT_RTT="cb91ai:~$ "
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
# The RTT control block lives in a section that survives resets. Without this
# option stale unread data from the previous run fills the buffer after a
# reflash and the boot log is dropped (NO_BLOCK_SKIP mode).
CONFIG_SEGGER_RTT_INIT_MODE_ALWAYS=y

# Shell helpers for interactive tests (i2c scan, gpio, flash, pwm, adc)
CONFIG_DEVICE_SHELL=y
CONFIG_I2C_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_FLASH_SHELL=y
CONFIG_PWM_SHELL=y
CONFIG_ADC_SHELL=y
CONFIG_KERNEL_SHELL=y

# Peripherals exercised by the self-test
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_JESD216_API=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_REGULATOR=y
# PDM microphone through the dmic API
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
CONFIG_HWINFO=y
CONFIG_REBOOT=y

CONFIG_MAIN_STACK_SIZE=6144

# USB composite device (new USB device stack, set up in src/usb.c): two
# CDC-ACM ports, the shell and the logs on the first, MCUmgr on the second,
# without the debug probe. VID/PID and strings are in src/usb.c.
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
# Keep only warnings from the USB stack in the log (Windows probes descriptors
# the device does not have, which is logged as harmless protocol errors)
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
# Messages logged before the host opens the COM port wait in this queue
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=2048

# Bluetooth LE: connectable advertising with the Device Information and Battery
# services, to exercise the 32 MHz crystal and the antenna path (V2-23)
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="CB-91AI"
CONFIG_BT_DEVICE_APPEARANCE=192
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="CB-91AI"
CONFIG_BT_DIS_MANUF_NAME_STR="COBALT"
# The revision string comes from the VERSION file, see CMakeLists.txt (EF-64)
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="V1"
# 0 dBm by default (EF-31): 4.8 mA peaks instead of 14.8 mA at +8 dBm, which a
# CR2016 feels. `cb91ai txpower <dBm>` raises it at run time for range tests
# (V2-23) through the vendor-specific HCI command.
CONFIG_BT_CTLR_TX_PWR_0=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
# The 32.768 kHz crystal of the V1 runs fast (10 pF load capacitors for a
# 12.5 pF crystal, V2-02, about +100 ppm expected): declare 250 ppm so that the
# controller widens its receive windows accordingly (EF-39). The default of
# 50 ppm would make the watch miss connection events at long intervals.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_250PPM=y
# Throughput for the BLE firmware image upload (~250 KB): raise the ATT MTU and
# the controller data length so one packet carries a full L2CAP PDU instead of
# 23 bytes, cutting the transfer from minutes to tens of seconds.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# 2M PHY asked for after each connection: half the time on air for the same
# bytes, in an upload as in a voice note later (the Cobalt Link specification). The
# central may refuse; ble.c logs the PHY in force. To weigh against the range
# in the closed case (risk R4): 2M costs a few dB of sensitivity.
CONFIG_BT_AUTO_PHY_PERIPHERAL_2M=y
CONFIG_BT_USER_PHY_UPDATE=y
# RSSI of the connection (HCI Read RSSI), for `cb91ai rssi`: the PC as the
# watch hears it, in the closed case (V2-23, R4)
CONFIG_BT_CTLR_CONN_RSSI=y

# MCUmgr (SMP) over the second USB CDC-ACM port: firmware updates through
# MCUboot, e.g. `smpmgr --port COMx upgrade zephyr.signed.bin`. MCUboot itself
# is built and the image signed by sysbuild (see sysbuild.conf).
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
# Also expose SMP over Bluetooth LE (nRF Connect Device Manager and the app),
# alongside the USB port kept for the bench (EI-07). The transport registers
# the SMP GATT service (8D53DC1D-...); ble.c advertises its UUID in the scan
# response so the host can find and filter the watch (EF-35, EF-60).
# Reassembly lets an SMP request span several GATT writes (needed once the MTU
# is raised); conn-param control asks for a fast interval during the transfer.
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
# The BT transport reassembles a whole SMP request into one net_buf, so the
# per-transaction payload is bounded by this buffer, not by the ATT MTU
# (default 384 B would cap the upload chunk regardless of the 498 B MTU). Raise
# it well above the MTU so the host uploads large chunks; clients read the value
# back from os/mcumgr-params. ~2.5 KB x NETBUF_COUNT (4) ~= 10 KB RAM.
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_IMG_MANAGER=y
# Direct execution with revert (sysbuild.conf). An image flashed over SWD must
# carry a trailer that says "confirmed", or MCUboot erases it: also build
# zephyr.signed.confirmed.hex. An image linked for the other slot is refused at
# the first chunk, thanks to the address imgtool writes in its header (Kconfig),
# and versions are compared down to the build number, as MCUboot does.
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
CONFIG_MCUMGR_GRP_IMG_REJECT_DIRECT_XIP_MISMATCHED_SLOT=y
CONFIG_MCUMGR_GRP_IMG_VERSION_CMP_USE_BUILD_NUMBER=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# --- Update safety (lot L1, step 2: EF-62 / EF-63) ---
# Task watchdog backed by the nRF WDT (alias watchdog0): the main loop feeds it
# every second. A hung firmware misses the feed, the WDT resets the chip, and
# MCUboot reverts an unconfirmed image at the next boot - the EF-62 revert path.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
# task_wdt installs the nRF WDT with a window of TASK_WDT_MIN_TIMEOUT +
# HW_FALLBACK_DELAY. That hardware timer keeps counting across the os-reset into
# MCUboot, which validates the incoming image (software SHA-256 + RSA over
# ~270 KB, well over 120 ms) without feeding the WDT. Widen the window far past
# that so a BLE/USB swap is never cut short and bricked into a reset loop; the
# 10 s software channel still catches a hung application.
CONFIG_TASK_WDT_MIN_TIMEOUT=3000
# The task watchdog feeds the hardware one every MIN_TIMEOUT when the
# application is idle, and the hardware window is MIN_TIMEOUT plus this delay.
# The default of 20 ms is thinner than one flash page erase (85 ms with the CPU
# stalled): an update received while the main loop sleeps could be cut by the
# watchdog. One second of margin.
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=1000
# MCUmgr callback hooks: leave the spare slot alone once a host writes or marks
# it (update.c), and show "UPd" on the glass just before the reset (EF-63). No
# battery veto since 0.1.44: same behaviour over the whole range of the CR2016.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
# DFU started/pending notifications, for the same spare-slot rule.
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2304
CONFIG_SHELL_STACK_SIZE=3072

# --- The link during a flash erase (lot B5) ---
# An update starts with the erase of its slot: 72 pages, 85 ms each, and a plain
# page erase cannot be interrupted. The flash driver books the radio timeline in
# 90 ms slots, connection events are skipped meanwhile, and the link died of its
# supervision timeout in the middle of the erase, one update out of three on
# the bench (reason 0x08, 2026-09-19). Partial erase cuts a page erase in slices
# of 3 ms that the controller interleaves with its connection events; the CPU
# is no longer stalled 85 ms at a time either.
CONFIG_SOC_FLASH_NRF_PARTIAL_ERASE=y
# Supervision timeout asked for: 4 s instead of the 420 ms Zephyr defaults, in
# the preferred parameters (published in the GAP service, requested 5 s after
# the connection) and in the fast parameters MCUmgr requests during a transfer.
# 420 ms is a handful of connection events at 30 to 50 ms: nothing, for a watch
# in a metal case at 0 dBm. Apple wants 2 to 6 s; 4 s is the value of
# the Cobalt Link specification. The central has the last word: ble.c logs what
# is really in force.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL_TIMEOUT=400

# MCUmgr hook for "a command was received": feeds the idle-disconnect timer of
# ble.c, so that a connection is only dropped when the host does nothing.
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y

# --- Idle consumption ---
# Device runtime power management: the QSPI NOR driver then puts the flash in
# deep power-down (about 1 uA instead of 10 to 20 uA in standby) whenever it is
# not in use, and wakes it up for each access (zephyr,pm-device-runtime-auto on
# the flash node of the board devicetree).
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
# The RTT shell polls its input buffer from a timer: the default of 10 ms wakes
# the CPU 100 times a second for a console that is rarely attached.
CONFIG_SHELL_RTT_RX_POLL_PERIOD=250

# --- Shared library (firmware/lib): drivers and wall clock ---
CONFIG_CB91AI_LIB_LCD=y
CONFIG_CB91AI_LIB_MIC=y
CONFIG_CB91AI_LIB_ACCEL=y
CONFIG_CB91AI_LIB_CLOCK=y
# The gestures of the watch (lot D3), tried on the real buttons by
# `cb91ai keys gesture` before the watch application can be installed
CONFIG_CB91AI_LIB_GESTURE=y

# --- Wall clock (lib/clock.c) ---
# Crystal correction stored in the settings (NVS on the storage partition),
# time kept across resets in retained RAM (fixed area of the board devicetree).
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
# Crystal error of the V1 boards (help of the option in Kconfig): +137.9 ppm
# measured on the bench board on 2026-09-19 with tools/lfxo_drift.py, 40 min
# against NTP, that is 11.9 s a day. Each watch then refines its own value.
CONFIG_CB91AI_CLOCK_DEFAULT_PPB=138000

# V1 board reworked on 2026-09-16 (V2-31): glass COM2 plot bridged to the driver COM0 output
CONFIG_CB91AI_LCD_GLASS_COM2_ON_COM0=y

# HFCLK clock control (also pulled in by the BLE controller).
CONFIG_CLOCK_CONTROL=y

# --- Bench commands over Bluetooth LE (0.1.46) ---
# On a board sealed in its watch there is neither RTT nor USB: the `cb91ai`
# commands, and only them, run from the PC over a GATT service of their own
# (src/remote.c, tools/ble_shell.py), on the dummy shell backend, in the main
# loop. Their output is sent back whole: room for the longest (keys, rec, arm).
# The log stays out of it (RTT and USB carry it).
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=1600
CONFIG_SHELL_DUMMY_INIT_LOG_LEVEL_NONE=y
