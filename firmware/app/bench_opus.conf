# Codec bench, Opus (with bench_codec.conf). libopus is not in this repository:
# see firmware/modules/opus/Kconfig. Fixed point, no FPU.

CONFIG_CB91AI_OPUS=y

# Measured on 2026-09-20 (libopus 1.5.2, mono, 16 kHz): the encoder state takes
# 24 548 bytes, and the encoder uses up to 24.7 kB of stack at complexities 0 to
# 5, 26.3 kB at 10. Room for that, and for the same two seconds of speech as
# the LC3 image.
CONFIG_CB91AI_CODEC_BENCH_STACK_SIZE=32768
CONFIG_CB91AI_CODEC_BENCH_OPUS_STATE_SIZE=25600
