# Codec bench image (lot K2): the self-test firmware plus
# `cb91ai codec ...`. Still a regular image: signed, updated over BLE, same
# watchdog and update path. Add the codec to measure with a second fragment,
# one codec per image (they do not fit in RAM together with the speech buffer):
#
#   -DEXTRA_CONF_FILE="bench_codec.conf;bench_lc3.conf"
#   -DEXTRA_CONF_FILE="bench_codec.conf;bench_opus.conf"
#
# The slot 1 variant takes the final .config of the application, so both
# variants get these fragments. On its own, this one only measures IMA ADPCM.

CONFIG_CB91AI_CODEC_BENCH=y
