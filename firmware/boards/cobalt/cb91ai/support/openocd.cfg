# OpenOCD configuration for the COBALT CB-91AI with an ST-Link V2.
#
# "dapdirect" mode gives OpenOCD raw access to the debug access port, which is
# required to unlock a locked nRF52840 (nrf52_recover). It needs ST-Link
# firmware V2J36 or later; upgrade with STM32CubeProgrammer if necessary.
# With older firmware, replace the first two lines by:
#   source [find interface/stlink.cfg]
#   transport select hla_swd
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/nrf52.cfg]

$_TARGETNAME configure -rtos Zephyr
